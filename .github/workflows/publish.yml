name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish (e.g. v0.2.0)
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

      - name: Create or update GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          export VERSION="$version"
          python3 <<'PY'
          import os, pathlib, re, textwrap
          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(rf"## \[{re.escape(version)}\].*?(?=\n## \[|\Z)", text, re.S)
          section = m.group(0).strip() if m else f"## [{version}]\n\nSee CHANGELOG.md."
          notes = textwrap.dedent(f"""\
          ## SuperQuantX {version}

          {section}

          ### Install
          ```bash
          pip install superquantx=={version}
          ```

          - PyPI: https://pypi.org/project/superquantx/{version}/
          - Docs: https://superagenticai.github.io/superquantx/
          """)
          pathlib.Path("release-notes.md").write_text(notes)
          print(f"Wrote release notes for {version}")
          PY
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "SuperQuantX ${version}" --notes-file release-notes.md
            gh release upload "$tag" dist/* --clobber || true
            echo "Updated existing release $tag"
          else
            gh release create "$tag" dist/* --title "SuperQuantX ${version}" --notes-file release-notes.md
            echo "Created release $tag"
          fi
