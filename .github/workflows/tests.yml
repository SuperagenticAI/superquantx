name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC to catch dependency issues
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        
    steps:
    - uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"
        
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
      
    - name: Install dependencies
      run: uv sync --extra dev
      
    - name: Run linting
      run: |
        uv run ruff check src/ tests/
        uv run black --check src/ tests/
        
    - name: Run type checking
      run: uv run mypy src/
      
    - name: Run tests
      run: uv run pytest --cov=superquantx --cov-report=xml -v
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        verbose: true

  test-backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [pennylane, qiskit, cirq]
        
    steps:
    - uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      
    - name: Set up Python 3.11
      run: uv python install 3.11
      
    - name: Install with backend
      run: uv sync --extra dev --extra ${{ matrix.backend }}
      
    - name: Test backend integration
      run: uv run pytest tests/integration/test_${{ matrix.backend }}_backend.py -v
      continue-on-error: true  # Backend tests can fail due to external dependencies

  test-algorithms:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      
    - name: Set up Python 3.11
      run: uv python install 3.11
      
    - name: Install dependencies
      run: uv sync --extra dev
      
    - name: Test quantum algorithms
      run: uv run pytest tests/unit/test_algorithms.py -v --tb=short
      
    - name: Run algorithm benchmarks
      run: uv run pytest tests/benchmarks/ -v --benchmark-only
      continue-on-error: true  # Benchmarks are informational

  docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      
    - name: Set up Python 3.11
      run: uv python install 3.11
      
    - name: Install dependencies
      run: uv sync --extra dev --extra docs
      
    - name: Build documentation
      run: uv run mkdocs build --strict
      
    - name: Test documentation links
      run: uv run mkdocs build --strict --verbose

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      
    - name: Set up Python 3.11
      run: uv python install 3.11
      
    - name: Install dependencies
      run: uv sync --extra dev
      
    - name: Run security checks
      run: |
        uv run bandit -r src/ -f json -o bandit-report.json
        uv run safety check --json --output safety-report.json
      continue-on-error: true
      
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  minimum-versions:
    # Test with minimum supported versions
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      
    - name: Set up Python 3.10
      run: uv python install 3.10
      
    - name: Install minimum dependencies
      run: |
        # Install with minimum versions from pyproject.toml
        uv sync --extra dev
        
    - name: Run core tests
      run: uv run pytest tests/unit/ -v -k "not slow"